[project]
name = "aptuni"
version = "0.1.0"
description = "Aptuni — a local-first personal context layer that grows more attuned to you over time."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.13"
authors = [{ name = "MEI Ruihao" }]
keywords = ["ai-agents", "personal-context", "memory", "mcp", "local-first", "context-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "mcp==2.2.0",
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/ruihaomei/aptuni"
Repository = "https://github.com/ruihaomei/aptuni"
Issues = "https://github.com/ruihaomei/aptuni/issues"
Changelog = "https://github.com/ruihaomei/aptuni/blob/main/CHANGELOG.md"

[project.scripts]
aptuni = "aptuni.cli.main:main"
aptuni-mcp = "aptuni.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.17",
]
supply = [
    "editables==0.5",
    "hatchling==1.27.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptuni"]

[tool.hatch.build.targets.sdist]
include = ["src/aptuni", "tests", "LICENSE", "NOTICE", "README.md", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["spikes", "tools", "tests/dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "PLR0915", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
