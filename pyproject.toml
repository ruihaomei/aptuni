[project]
name = "aptuni"
version = "0.1.0.dev0"
description = "Aptuni — a local-first personal context layer that grows more attuned to you over time."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
authors = [{ name = "MEI Ruihao" }]
keywords = ["ai-agents", "personal-context", "memory", "mcp", "local-first", "context-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = [
    "pydantic>=2.11,<3",
]

[project.scripts]
aptuni = "aptuni.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aptuni"]

[tool.hatch.build.targets.sdist]
include = ["src/aptuni", "tests", "LICENSE", "NOTICE", "README.md", "THIRD_PARTY_NOTICES.md"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["spikes", "tools", "tests/dev"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415", "PLR0915", "S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
