[project]
name = "aptuni-top-down-learning"
version = "0.1.0"
description = "Manual Top-Down Learning Agent plugin for Aptuni"
requires-python = ">=3.13"
dependencies = ["aptuni>=0.2.0b1,<0.3"]

[project.scripts]
top-down-study-mcp = "top_down_learning.mcp_server:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/top_down_learning"]
