name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  UV_VERSION: "0.12.17"
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Verify and build release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Verify tag and locked environment
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          if version != expected:
              raise SystemExit(f"tag/version mismatch: tag={expected}, project={version}")
          PY
          uv lock --check
          uv sync --locked --all-groups --no-install-project
          uv sync --locked --all-groups --no-build-isolation
      - name: Run release gate
        run: |
          uv run --no-sync pytest
          uv run --no-sync ruff check .
          uv run --no-sync mypy src
          python tools/check_relay.py
          python -m unittest discover -s tests/dev -v
          python tools/check_supply_chain.py notices
          python tools/check_supply_chain.py secrets
          python tools/check_supply_chain.py workflow
      - name: Export release evidence
        run: |
          mkdir -p artifacts
          uv export --locked --no-dev --no-emit-project --format requirements.txt \
            --output-file artifacts/runtime-requirements.txt
          uv export --locked --no-dev --no-emit-project --format cyclonedx1.5 \
            --output-file artifacts/aptuni.cdx.json
          uv run --no-sync pip-audit --require-hashes --progress-spinner off \
            --format json --output artifacts/pip-audit.json \
            --requirement artifacts/runtime-requirements.txt
          uv run --no-sync python tools/run_evals.py --sbom artifacts/aptuni.cdx.json \
            --output artifacts/eval-run.json
      - name: Build reproducible distributions
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          uv build --offline --no-build-isolation --out-dir build-a
          uv build --offline --no-build-isolation --out-dir build-b
          (cd build-a && sha256sum *) > artifacts/build-a.sha256
          (cd build-b && sha256sum *) > artifacts/build-b.sha256
          diff -u artifacts/build-a.sha256 artifacts/build-b.sha256
          python tools/check_supply_chain.py artifacts build-a/*
      - name: Smoke release wheel
        run: |
          uv venv --python "${PYTHON_VERSION}" clean-wheel
          uv pip install --python clean-wheel/bin/python --require-hashes \
            --requirement artifacts/runtime-requirements.txt
          uv pip install --python clean-wheel/bin/python --no-deps build-a/*.whl
          test "$(clean-wheel/bin/aptuni --version)" = "aptuni ${GITHUB_REF_NAME#v}"
          clean-wheel/bin/aptuni --help >/dev/null
          clean-wheel/bin/aptuni recipe list --lang zh-CN >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: build-a/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/aptuni/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist-${{ github.sha }}
          path: dist/
      - name: Generate attestations
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6
      - name: Publish distributions
        run: uv publish dist/*.whl dist/*.tar.gz
